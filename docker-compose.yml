version: '3.8'

services:
  # Chat Server Service
  chat-server:
    build:
      context: .
      dockerfile: aws/Dockerfile.production
    image: transcribe-chat-server:latest
    container_name: transcribe-chat-server
    ports:
      - '5000:5000'
    environment:
      # AWS Configuration
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-ap-northeast-1}

      # Zilliz Cloud Configuration
      - ZILLIZ_URI=${ZILLIZ_URI}
      - ZILLIZ_TOKEN=${ZILLIZ_TOKEN}

      # OpenAI Configuration
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-3.5-turbo}

      # Flask Configuration
      - FLASK_PORT=5000
      - FLASK_DEBUG=false
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-your-secret-key-change-this}

      # Python Configuration
      - PYTHONPATH=/app/src
      - PYTHONUNBUFFERED=1

    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'

    restart: unless-stopped

    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import requests; requests.get('http://localhost:5000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Optional: Create a network for service communication
networks:
  default:
    name: transcribe-network
