# Docker Compose for Flask Chat Server Development
version: '3.8'

services:
  chat-server-prod:
    build:
      context: .
      dockerfile: aws/Dockerfile.production
    container_name: transcribe-chat-prod
    ports:
      - '5001:5000'
    volumes:
      - ./.env:/app/.env:ro
      - chat-logs:/app/logs
      - chat-cache:/app/cache
    environment:
      - FLASK_ENV=production
      - FLASK_PORT=5000
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - transcribe-network

volumes:
  chat-logs:
    driver: local
  chat-cache:
    driver: local

networks:
  transcribe-network:
    driver: bridge
